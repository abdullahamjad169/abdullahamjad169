<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Glowing Hexagon Gradient -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Hexagon Glow Filter -->
    <filter id="hexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes netFade {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.6; }
    }
    .constellation {
      animation: netFade 6s ease-in-out infinite;
    }
    .mono-title {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace;
      font-size: 46px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 4px;
    }
    .mono-sub {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace;
      font-size: 20px;
      font-weight: 400;
      fill: #d8b4fe;
      letter-spacing: 2px;
    }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="916" height="276" rx="22" ry="22" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Constellation Geometric Network Lines -->
  <g class="constellation" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.22" fill="none">
    <line x1="20" y1="30" x2="110" y2="70" />
    <line x1="110" y1="70" x2="60" y2="150" />
    <line x1="60" y1="150" x2="30" y2="240" />
    <line x1="110" y1="70" x2="200" y2="40" />
    <line x1="200" y1="40" x2="210" y2="130" />
    <line x1="60" y1="150" x2="140" y2="220" />
    <line x1="140" y1="220" x2="210" y2="130" />
    <line x1="140" y1="220" x2="250" y2="250" />
    <line x1="200" y1="40" x2="350" y2="30" />
    <line x1="210" y1="130" x2="320" y2="110" />
    <line x1="250" y1="250" x2="340" y2="210" />
    <line x1="350" y1="30" x2="460" y2="50" />
    <line x1="320" y1="110" x2="460" y2="50" />
    <line x1="340" y1="210" x2="470" y2="240" />
    <line x1="460" y1="50" x2="570" y2="35" />
    <line x1="470" y1="240" x2="580" y2="220" />
    <line x1="570" y1="35" x2="710" y2="40" />
    <line x1="580" y1="220" x2="670" y2="250" />
    <line x1="710" y1="40" x2="710" y2="130" />
    <line x1="570" y1="35" x2="710" y2="130" />
    <line x1="710" y1="130" x2="670" y2="250" />
    <line x1="710" y1="40" x2="810" y2="70" />
    <line x1="810" y1="70" x2="710" y2="130" />
    <line x1="810" y1="70" x2="890" y2="30" />
    <line x1="810" y1="70" x2="860" y2="150" />
    <line x1="860" y1="150" x2="890" y2="240" />
    <line x1="860" y1="150" x2="780" y2="220" />
    <line x1="670" y1="250" x2="780" y2="220" />
    <line x1="780" y1="220" x2="890" y2="240" />
    <line x1="20" y1="30" x2="60" y2="150" stroke-opacity="0.12" />
    <line x1="200" y1="40" x2="140" y2="220" stroke-opacity="0.12" />
    <line x1="350" y1="30" x2="340" y2="210" stroke-opacity="0.1" />
    <line x1="570" y1="35" x2="580" y2="220" stroke-opacity="0.1" />
    <line x1="710" y1="40" x2="780" y2="220" stroke-opacity="0.12" />
    <line x1="890" y1="30" x2="860" y2="150" stroke-opacity="0.12" />
  </g>

  <!-- Constellation Nodes -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="20" cy="30" r="2.5" />
    <circle cx="110" cy="70" r="3" fill="#818cf8" />
    <circle cx="60" cy="150" r="2.5" />
    <circle cx="30" cy="240" r="2.5" />
    <circle cx="200" cy="40" r="3" />
    <circle cx="210" cy="130" r="2.5" fill="#f472b6" />
    <circle cx="140" cy="220" r="3" />
    <circle cx="250" cy="250" r="2.5" />
    <circle cx="350" cy="30" r="2.5" />
    <circle cx="320" cy="110" r="2" fill="#818cf8" />
    <circle cx="340" cy="210" r="2.5" />
    <circle cx="460" cy="50" r="3" fill="#f472b6" />
    <circle cx="470" cy="240" r="3" fill="#38bdf8" />
    <circle cx="570" cy="35" r="2.5" />
    <circle cx="580" cy="220" r="2.5" />
    <circle cx="710" cy="40" r="3" />
    <circle cx="710" cy="130" r="2.5" fill="#818cf8" />
    <circle cx="670" cy="250" r="2.5" />
    <circle cx="810" cy="70" r="3" fill="#f472b6" />
    <circle cx="860" cy="150" r="2.5" />
    <circle cx="780" cy="220" r="3" />
    <circle cx="890" cy="30" r="2.5" />
    <circle cx="890" cy="240" r="2.5" />
  </g>

  <!-- Left Emblem: Hexagon with </> -->
  <g transform="translate(105, 140)">
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26"
             fill="none" stroke="url(#hexGrad)" stroke-width="4.5" stroke-linejoin="round"
             filter="url(#hexGlow)" opacity="0.4" />
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25"
             fill="#070d1d" fill-opacity="0.85" stroke="url(#hexGrad)" stroke-width="4.5" stroke-linejoin="round" />
    <path d="M-18,-10 L-28,0 L-18,10" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-4,14 L4,-14" fill="none" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M18,-10 L28,0 L18,10" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Center Typography -->
  <g>
    <text x="460" y="125" text-anchor="middle" class="mono-title">Hello G!</text>
    <text x="460" y="172" text-anchor="middle" class="mono-sub">Somewhere between soul and syntax.</text>
  </g>

  <!-- Right Emblem: Hexagon with </> -->
  <g transform="translate(815, 140)">
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26"
             fill="none" stroke="url(#hexGrad)" stroke-width="4.5" stroke-linejoin="round"
             filter="url(#hexGlow)" opacity="0.4" />
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25"
             fill="#070d1d" fill-opacity="0.85" stroke="url(#hexGrad)" stroke-width="4.5" stroke-linejoin="round" />
    <path d="M-18,-10 L-28,0 L-18,10" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-4,14 L4,-14" fill="none" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M18,-10 L28,0 L18,10" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
